name: FlowForge CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop


jobs:

  test:

    runs-on: ubuntu-latest

    env:
      APP_NAME: FlowForge
      APP_VERSION: 1.0.0
      DEBUG: false

      MONGODB_URL: mongodb://127.0.0.1:27017
      MONGODB_DATABASE: flowforge_test

      POSTGRES_URL: postgresql+psycopg://flowforge:flowforge@127.0.0.1:5432/flowforge

      JWT_SECRET: ci-test-secret
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 60

    services:

      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: flowforge
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U flowforge -d flowforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


      mongodb:
        image: mongo:8

        ports:
          - 27017:27017

        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Verify CI environment
        working-directory: backend
        run: |
          python -c "from app.core.config import settings; print('PostgreSQL:', settings.POSTGRES_URL); print('MongoDB:', settings.MONGODB_URL)"


      - name: Run database migrations
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Seed test database
        working-directory: backend
        run: |
          python -m app.db.seed

      - name: Run tests
        working-directory: backend
        run: |
          pytest -v


  docker-build:

    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build Docker image
        run: |
          docker build \
            -t flowforge-backend \
            ./backend